<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada (404) — Luciano Espinosa</title>
  <meta name="description" content="La página que buscás no existe. Volvé al portfolio de Luciano Espinosa.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0b14">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="/" aria-label="Luciano Espinosa, volver al inicio">
        <span class="logo__mark" aria-hidden="true">LE</span>
        <span>espinosa<span aria-hidden="true">.dev</span></span>
      </a>
    </div>
  </header>
  <main id="main" class="error-page" tabindex="-1">
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="container" style="position: relative;">
      <p class="error-page__code" aria-hidden="true">404</p>
      <h1>Señal perdida: esta página no existe</h1>
      <p>Puede que el link esté mal escrito o que la página se haya movido.</p>
      <div class="hero__ctas">
        <a class="btn btn--primary" href="/">Volver al inicio</a>
        <a class="btn btn--ghost" href="/#proyectos">Ver proyectos</a>
      </div>
    </div>
  </main>
</body>
</html>
